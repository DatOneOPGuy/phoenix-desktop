name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest  # Free tier — no macOS minutes burned

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install linting tools
        run: pip install ruff

      - name: Check syntax (compile all .py files)
        run: python -m compileall -q plugins/ utils/ gui/ main.py

      - name: Lint with Ruff
        run: ruff check --select=E,F,W --ignore=E501,F401 plugins/ utils/ gui/ main.py
