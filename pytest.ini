[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -ra
markers =
    unit: Pure unit tests (no I/O, no network, no subprocess)
    integration: Tests that wire multiple components together
    security: Security-focused tests (input validation, secrets, permissions)
    platform_darwin: macOS-specific tests (skip on other platforms)
    platform_windows: Windows-specific tests (skip on other platforms)
    platform_linux: Linux-specific tests (skip on other platforms)
    slow: Tests that are expected to be slow (downloads, installs)
    network: Tests that require real network access
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
